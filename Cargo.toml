[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/gateway-core",
    "crates/transport",
    "crates/identity",
    "crates/policy",
    "crates/vault",
    "crates/injectors",
    "crates/audit",
    "crates/privileged-helper",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/o3willard-AI/Chaperone"
authors = ["Chaperone contributors"]

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
argon2 = "0.5"
base64 = "0.22"
canon-json = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
rpassword = "7"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
russh = "0.60"
sha2 = "0.10"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", default-features = false, features = [
    "std",
    "parsing",
    "formatting",
] }
tokio = { version = "1.47", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "process",
    "time",
    "sync",
] }
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[profile.release]
# Reproducible-build posture (PLAN Phase 10): deterministic single-unit
# codegen, linked-time optimization, no stray debug info.
codegen-units = 1
lto = true
strip = true
# Security-relevant tradeoff: integer overflow panics loudly instead of
# wrapping silently. A credential broker must never arithmetic-wrap its way
# past a limit check; the negligible runtime cost is accepted deliberately.
overflow-checks = true
