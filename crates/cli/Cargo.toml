[package]
name = "chaperone-cli"
description = "Operator CLI: enrollment, policy authoring, vault CRUD, audit verification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "chaperone"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[dependencies]
chaperone-gateway-core = { path = "../gateway-core" }
chaperone-transport = { path = "../transport" }
tokio.workspace = true
chaperone-vault = { path = "../vault" }
rpassword.workspace = true
zeroize.workspace = true
chaperone-audit = { path = "../audit" }
chaperone-identity = { path = "../identity" }
chaperone-policy = { path = "../policy" }
chaperone-protocol = { path = "../protocol" }
tempfile.workspace = true
time.workspace = true

chaperone-ui = { path = "../ui" }

[features]
# Forward the vault crate's keyring feature to the CLI binary so
# `chaperone vault-init --sealer keyring` exists (issue #50). Off by
# default: it needs a live OS credential service at runtime.
keyring = ["chaperone-vault/keyring"]

[lints]
workspace = true
