[package]
name = "chaperone-gateway-core"
description = "Orchestration spine: verify -> policy -> confirm -> resolve -> inject -> audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64.workspace = true
tempfile.workspace = true
time.workspace = true
toml.workspace = true
chaperone-audit = { path = "../audit" }
chaperone-identity = { path = "../identity" }
chaperone-injectors = { path = "../injectors" }
chaperone-policy = { path = "../policy" }
chaperone-protocol = { path = "../protocol" }
chaperone-vault = { path = "../vault" }
rand_core.workspace = true
async-trait.workspace = true
russh = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
default = ["ssh", "postgres"]
# Real SSH sessions via the maintained pure-Rust client.
ssh = ["dep:russh"]
# PostgreSQL SCRAM-SHA-256 (db-scram mechanism) via tokio-postgres.
postgres = ["dep:tokio-postgres"]

[dev-dependencies]
ed25519-dalek.workspace = true
zeroize.workspace = true
chaperone-protocol = { path = "../protocol", features = ["test-util"] }

[lints]
workspace = true
