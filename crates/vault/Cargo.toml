[package]
name = "chaperone-vault"
description = "Vault abstraction over secret backends plus the built-in sealed local vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
rand_core.workspace = true
serde.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zeroize.workspace = true
keyring = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
# Platform credential-store sealing (D5 first preference). Off by default:
# it needs a live OS service at RUNTIME (secret-service / Keychain /
# Credential Manager), which stripped-down hosts may lack. The passphrase
# sealer is the documented-weaker fallback that works everywhere.
keyring = ["dep:keyring"]

[lints]
workspace = true
