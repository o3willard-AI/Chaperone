# Release pipeline: tag-triggered, three platforms, reproducible locked
# builds and a sha256 manifest. No code signing, no release keys (SLSA
# posture - see docs/RELEASE.md): anyone can rebuild from source and confirm
# the bytes match the published hashes.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build (locked, release)
        run: cargo build --release --locked -p chaperone-cli -p chaperone-privileged-helper

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="stage/chaperone-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp target/release/chaperone "$STAGE/"
          cp target/release/chaperone-helper "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          cp install.sh uninstall.sh "$STAGE/"
          mkdir -p "$STAGE/packaging"
          cp packaging/* "$STAGE/packaging/"
          tar czf "chaperone-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C stage .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "chaperone-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/chaperone.exe $stage/
          Copy-Item target/release/chaperone-helper.exe $stage/
          Copy-Item README.md $stage/
          Copy-Item LICENSE $stage/
          if (Test-Path install.ps1) { Copy-Item install.ps1 $stage/ }
          if (Test-Path uninstall.ps1) { Copy-Item uninstall.ps1 $stage/ }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Checksum
        shell: bash
        run: |
          f=$(ls chaperone-${{ github.ref_name }}-${{ matrix.target }}.* | head -1)
          sha256sum "$f" > "$f.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            chaperone-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          cd dist
          sha256sum chaperone-* | grep -v 'sha256$' > SHA256SUMS.txt || true
          ls -la

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${{ github.ref_name }}.md"
          test -f "$NOTES" || { echo "missing release notes: $NOTES" >&2; exit 1; }
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release exists; uploading assets"
          else
            gh release create "${{ github.ref_name }}" \
              --prerelease \
              --title "Chaperone ${{ github.ref_name }}" \
              --notes-file "$NOTES"
          fi
          # Upload each file explicitly (no glob-in-quotes pitfalls).
          find dist -type f -print0 | while IFS= read -r -d '' f; do
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
