# Chaperone CI — build, test, lint, and dependency audit.
#
# A public security project with red CI is a bad look and a real risk
# (IMPLEMENTATION_AGENT_BRIEF §5 Phase 0). Cross-platform from the first
# commit per Brief §4: Linux, macOS, Windows from one codebase.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly supply-chain recheck so new CVEs surface even on quiet repos.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test-clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (Marvin, RSA): Chaperone is an Ed25519-only SSH
      # client with no RSA decrypt path - see deny.toml for the full reason.
      - run: cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071

  pg-e2e:
    # Real-PostgreSQL db-scram acceptance (gated by env; other jobs skip).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgtest
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: pgtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --locked -p chaperone-gateway-core --test db_scram
        env:
          CHAPERONE_TEST_PG: postgres://pgtest:pgpass@localhost:5432/pgtest

  deny:
    # Supply-chain policy (PLAN Phase 10): advisories deny, licenses pinned,
    # unknown registries denied.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  reproducible:
    # Two clean locked release builds must hash identically (Phase 10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y pkg-config
      - run: ./scripts/repro-check.sh
